name: Auto Update XSMB Daily

on:
  schedule:
    # 18:37 và 19:07 giờ Việt Nam
    - cron: '37 11 * * *'
    - cron: '7 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run update script
        run: python update_xsmb.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add xsmb_result.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update XSMB daily result" && git push)
